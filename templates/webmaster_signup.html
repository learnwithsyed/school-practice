<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webmaster Signup</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c7be5;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #2c7be5;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #1a5fc4;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #2c7be5;
            text-decoration: none;
            font-weight: bold;
        }
        .links a:hover {
            text-decoration: underline;
        }

        /* Mobile friendly */
        @media(max-width:600px){
            .container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Webmaster Signup</h2>

    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your full name" required>

        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>

        <label>Recovery Keyword</label>
        <input type="text" name="keyword" placeholder="Used for password recovery" required>

        <button type="submit">Create Account</button>
    </form>

    <div class="links">
        Already have an account?
        <a href="{{ url_for('webmaster_login') }}">Login here</a>
    </div>
</div>

</body>
</html>
