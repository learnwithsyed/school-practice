<!DOCTYPE html>
<html>
<head>
    <title>User Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">
    <h3>📢 User Feedback</h3>

    {% if feedbacks %}
    <table class="table table-bordered bg-white shadow">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>User Type</th>
                <th>Username</th>
                <th>Feedback</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
        {% for fb in feedbacks %}
            <tr>
                <td>{{ fb.id }}</td>
                <td>{{ fb.user_role }}</td>
                <td>{{ fb.username }}</td>
                <td style="max-width:400px">{{ fb.message }}</td>
                <td>{{ fb.created_at }}</td>  <!-- Display as string -->
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
        <p>No feedback yet.</p>
    {% endif %}

    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mt-3">⬅ Back</a>
</div>

</body>
</html>
