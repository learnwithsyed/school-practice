<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Questions</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c7be5;
            margin-bottom: 20px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #2c7be5;
            color: white;
        }
        td {
            font-size: 14px;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-add {
            background-color: #28a745;
            color: white;
            margin-bottom: 15px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-add:hover { background-color: #218838; }
        .btn-delete {
            background-color: #dc3545;
            color: white;
        }
        .btn-delete:hover { background-color: #c82333; }
        a.back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2c7be5;
            font-weight: bold;
        }
        a.back:hover { text-decoration: underline; }

        /* Responsive */
        @media(max-width:800px){
            table, th, td {
                font-size: 12px;
            }
            .container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 My Questions</h2>

    <a href="{{ url_for('add_question') }}" class="btn btn-add">
    ➕ Add New Question
</a>


    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Class</th>
                <th>Subject</th>
                <th>Question</th>
                <th>Correct</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for q in questions %}
            <tr>
                <td>{{ q.id }}</td>
                <td>{{ q.class }}</td>
                <td>{{ q.subject }}</td>
                <td>{{ q.question[:50] }}{% if q.question|length > 50 %}...{% endif %}</td>
                <td>{{ q.correct_option }}</td>
                <td>
                    <a href="/webmaster/questions/delete/{{ q.id }}"
                       onclick="return confirm('Delete this question?')">
                       <button class="btn btn-delete">❌ Delete</button>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('webmaster_dashboard') }}" class="back">⬅ Back to Dashboard</a>
</div>

</body>
</html>
