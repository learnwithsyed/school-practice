<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Question</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c7be5;
            margin-bottom: 25px;
            text-align: center;
        }
        form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #2c7be5;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        button:hover {
            background-color: #1a5fc4;
        }
        a.back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2c7be5;
            font-weight: bold;
        }
        a.back:hover {
            text-decoration: underline;
        }
        /* Responsive */
        @media(max-width:600px){
            .container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>➕ Add New Question</h2>

    <form method="POST">
        <label>Class:</label>
        <input type="number" name="class" required min="1" max="10">

        <label>Subject:</label>
        <input type="text" name="subject" required placeholder="e.g., Computer, Maths">

        <label>Difficulty:</label>
        <select name="difficulty" required>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <label>Question:</label>
        <textarea name="question" required></textarea>

        <label>Option A:</label>
        <input type="text" name="option_a" required>

        <label>Option B:</label>
        <input type="text" name="option_b" required>

        <label>Option C:</label>
        <input type="text" name="option_c" required>

        <label>Option D:</label>
        <input type="text" name="option_d" required>

        <label>Correct Option:</label>
        <select name="correct_option" required>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>

        <label>Explanation:</label>
        <textarea name="explanation" required></textarea>

        <button type="submit">Add Question</button>
    </form>

    <a href="{{ url_for('webmaster_questions') }}" class="back">⬅ Back to My Questions</a>
</div>

</body>
</html>
