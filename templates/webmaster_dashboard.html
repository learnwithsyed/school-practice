<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webmaster Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
        }
        .dashboard-card {
            transition: 0.3s;
            border-radius: 12px;
        }
        .dashboard-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }
    </style>
</head>

<body>

<!-- Top Bar -->
<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand fw-bold">🧑‍💻 Webmaster Dashboard</span>
    <a href="{{ url_for('webmaster_logout') }}" class="btn btn-light btn-sm">
        Logout
    </a>
</nav>

<!-- Content -->
<div class="container mt-5">
    <h3 class="text-center mb-4">Manage Your Content</h3>

    <div class="row g-4 justify-content-center">

        <!-- My Questions -->
        <div class="col-md-4 col-sm-6">
            <div class="card dashboard-card text-center p-4">
                <i class="bi bi-journal-text display-4 text-primary"></i>
                <h5 class="mt-3">My Questions</h5>
                <p class="text-muted">View & manage questions</p>
                <a href="{{ url_for('webmaster_questions') }}" class="btn btn-primary">
                    Open
                </a>
            </div>
        </div>

        <!-- Upload Excel -->
        <div class="col-md-4 col-sm-6">
            <div class="card dashboard-card text-center p-4">
                <i class="bi bi-file-earmark-excel display-4 text-success"></i>
                <h5 class="mt-3">Upload Excel</h5>
                <p class="text-muted">Bulk upload questions</p>
                <a href="{{ url_for('upload_excel') }}" class="btn btn-success">
                    Upload
                </a>
            </div>
        </div>

    </div>
</div>

<!-- Footer -->
<footer class="text-center text-muted py-4 mt-5">
    © School Practice Platform
</footer>

</body>
</html>
